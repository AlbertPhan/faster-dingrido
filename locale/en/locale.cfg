[mod-setting-name]
dingrido-friction=Dingrido Friction
dingrido-rotation-snap-angle=Dingrido Rotation Snap Angle
dingrido-power-consumption=Dingrido Power Consumption
dingrido-fuel-effectivity=Dingrido Fuel Efficiency Multiplier
dingrido-braking-force=Dingrido Braking Force


[mod-setting-description]
dingrido-friction=Adjusts the friction of the Dingrido which affects acceleration and top speed. Lower is faster. Original friction is 0.003
dingrido-rotation-snap-angle=Vehicle will snap to the vertical, horizontal or diagonal axis if it's within this angle(degrees). Default 2 deg.
dingrido-power-consumption=Adjusts the power consumption of the Dingrido which affects how fast it can accelerate. eg "20MW". Default 100MW.
